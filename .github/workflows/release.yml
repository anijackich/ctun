name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Rosetta
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Fetch cores
        run: |
          wails3 task core:fetch
          wails3 task core:fetch CORE_ARCH=amd64

      - name: Package
        run: wails3 task darwin:package:dmg:universal

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg="ctun-${version}-macos-universal.dmg"
          mv bin/ctun.dmg "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
          prerelease=""
          if [[ "$version" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" "$dmg" "$dmg.sha256" \
            --title "ctun $version" --generate-notes $prerelease

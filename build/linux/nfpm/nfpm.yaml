name: "ctun"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "mihomo desktop client"
vendor: "ctun"
homepage: "https://github.com/anijackich/ctun"
license: "GPL-3.0"
release: "1"

contents:
  - src: "./bin/ctun"
    dst: "/usr/local/bin/ctun"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/ctun.png"
  - src: "./build/linux/ctun.desktop"
    dst: "/usr/share/applications/ctun.desktop"

depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"

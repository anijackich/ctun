mode: global
log-level: info
find-process-mode: always
ipv6: false
allow-lan: false
external-controller: 127.0.0.1:41234
secret: s3cret
profile:
    store-selected: false
    store-fake-ip: false
dns:
    enable: true
    ipv6: false
    respect-rules: false
    default-nameserver:
        - https://1.1.1.1/dns-query
        - https://8.8.8.8/dns-query
    nameserver:
        - https://1.1.1.1/dns-query
        - https://8.8.8.8/dns-query
    direct-nameserver:
        - https://1.1.1.1/dns-query
        - https://8.8.8.8/dns-query
    proxy-server-nameserver:
        - https://1.1.1.1/dns-query
        - https://8.8.8.8/dns-query
proxies: []
proxy-groups:
    - name: PROXY
      proxies:
        - DIRECT
      type: select
rules:
    - MATCH,PROXY
